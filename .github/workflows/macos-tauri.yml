name: macOS Tauri

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install Intel macOS target
        run: rustup target add x86_64-apple-darwin
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: macos-tauri-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', 'bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/desktop build
      - name: Archive macOS app
        run: ditto -c -k --sequesterRsrc --keepParent apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/OpenBible.app OpenBible_${GITHUB_REF_NAME}_universal.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: openbible-macos-universal
          path: OpenBible_*_universal.app.zip

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: linux-tauri-${{ hashFiles('**/Cargo.lock', 'bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/desktop build:linux
      - uses: actions/upload-artifact@v4
        with:
          name: openbible-linux-packages
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: openbible-*
          path: release-assets
          merge-multiple: true
      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --title "OpenBible ${GITHUB_REF_NAME}" --generate-notes
      - name: Upload binaries to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          test "${#assets[@]}" -gt 0
          gh release upload "${GITHUB_REF_NAME}" --clobber --repo "${GITHUB_REPOSITORY}" "${assets[@]}"
